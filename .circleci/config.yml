version: 2.1

orbs:
  ruby: circleci/ruby@2.0.0
  browser-tools: circleci/browser-tools@1.5.2
  nodejs: circleci/node@5.1.1
  docker: circleci/docker@1.5.0

executors:
  test_executor:
    parameters:
      ruby_version:
        type: string
      mysql_version:
        type: string

    working_directory: ~/search-gov

    docker:
      - image: cimg/ruby:<< parameters.ruby_version >>
        environment:
          RAILS_ENV: test

      - image: mysql:<< parameters.mysql_version >>
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_ROOT_HOST: "%"

      - image: redis:6.2

      - image: opensearchproject/opensearch:3
        environment:
          cluster.name: os-cluster
          discovery.type: single-node
          bootstrap.memory_lock: false
          http.port: 9300
          transport.port: 9500
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms256m -Xmx256m"
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: S3venDr4gon!
        # Install analysis plugins before OpenSearch starts. `docker restart` of
        # the CircleCI service container SIGTERMs PID 1 (exit 143) and fails the
        # job even when RSpec passed.
        entrypoint: ["/bin/bash", "-c"]
        command: ["trap 'exit 0' TERM INT; /usr/share/opensearch/bin/opensearch-plugin install --batch analysis-icu analysis-kuromoji analysis-smartcn; /usr/share/opensearch/opensearch-docker-entrypoint.sh opensearch & wait $!"]

      - image: apache/tika:2.4.1

commands:
  wait_for_opensearch:
    description: "Wait for OpenSearch cluster health"
    steps:
      - run:
          name: Wait for OpenSearch cluster health
          command: |
            echo "Waiting for OpenSearch cluster health..."
            curl --fail --silent --show-error \
              "http://localhost:9300/_cluster/health?wait_for_status=yellow&timeout=120s"
  install_firefox:
    description: "Install latest Firefox"
    steps:
      - browser-tools/install-firefox
      - run:
          command: |
            firefox --version
          name: Check install
  install_js_dependencies:
    description: "Install JavaScript dependencies"
    steps:
      - run:
          name: Clean node_modules
          command: rm -rf node_modules
      - nodejs/install:
          node-version: "22.22.2"
          install-yarn: true
          # Pin Yarn: the orb's "latest" lookup intermittently resolves an
          # empty version and downloads a corrupt tarball, breaking CI setup.
          yarn-version: "1.22.22"
      - run:
          name: Yarn Install
          command: yarn install --frozen-lockfile
  precompile_assets:
    description: "Pre-compile assets"
    steps:
      - run: bin/rails assets:precompile
  prepare_database:
    description: "Prepare the test database"
    steps:
      - run: bundle exec rake db:setup

jobs:
  checkout_code:
    parameters:
      ruby_version:
        type: string
      mysql_version:
        type: string

    executor:
      name: test_executor
      ruby_version: << parameters.ruby_version >>
      mysql_version: << parameters.mysql_version >>

    steps:
      - checkout

      - run:
          name: Wait for OpenSearch
          command: dockerize -wait tcp://localhost:9300 -timeout 2m
      - wait_for_opensearch

      - save_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/search-gov

  rspec:
    parameters:
      ruby_version:
        type: string
      mysql_version:
        type: string

    executor:
      name: test_executor
      ruby_version: << parameters.ruby_version >>
      mysql_version: << parameters.mysql_version >>

    parallelism: 6

    steps:
      - setup_remote_docker # Ensure Docker is set up for this job
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}

      - ruby/install-deps:
          key: gems-ruby-<< parameters.ruby_version >>-v{{ .Environment.CACHE_VERSION }}

      - install_js_dependencies

      - install_firefox

      - wait_for_opensearch

      - prepare_database

      - precompile_assets

      - run:
          name: Run Tests
          command: |
            bin/rails opensearch:create_all_indexes

            mkdir /tmp/test-results

            # Run Rspec tests
            bundle exec rspec --format progress \
                              --format RspecJunitFormatter \
                              --out /tmp/test-results/rspec.xml \
                              --format progress \
                              $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)

      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

  cucumber:
    parameters:
      ruby_version:
        type: string
      mysql_version:
        type: string

    executor:
      name: test_executor
      ruby_version: << parameters.ruby_version >>
      mysql_version: << parameters.mysql_version >>

    parallelism: 10

    steps:
      - setup_remote_docker # Ensure Docker is set up for this job
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}

      - ruby/install-deps:
          key: gems-ruby-<< parameters.ruby_version >>-v{{ .Environment.CACHE_VERSION }}

      - install_js_dependencies

      - install_firefox

      - wait_for_opensearch

      - prepare_database

      - precompile_assets

      - run:
          name: Run Tests
          command: |
            bin/rails opensearch:create_all_indexes


            bundle exec rake tmp:create

            mkdir /tmp/test-results

            # Run cucumber tests
            bundle exec cucumber --format progress \
                                --format junit \
                                --out /tmp/test-results/cucumber.xml \
                                --format progress \
                                -- $(circleci tests glob "features/*.feature" | circleci tests split --split-by=timings)

      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

  jest:
    parameters:
      ruby_version:
        type: string
      mysql_version:
        type: string
      node_version:
        type: string

    executor:
      name: test_executor
      ruby_version: << parameters.ruby_version >>
      mysql_version: << parameters.mysql_version >>

    steps:
      - setup_remote_docker # Ensure Docker is set up for this job
      - restore_cache:
          key: repo-{{ .Environment.CIRCLE_SHA1 }}

      - nodejs/install:
          install-yarn: true
          node-version: << parameters.node_version >>
          # Pin Yarn: the orb's "latest" lookup intermittently resolves an
          # empty version and downloads a corrupt tarball, breaking CI setup.
          yarn-version: "1.22.22"

      - install_js_dependencies

      - run:
          name: Run Tests
          command: |
            # Run jest tests
            yarn test:coverage

workflows:
  version: 2
  build_and_test:
    jobs:
      - checkout_code:
          # Keep the ES version in the GitHub status context so required
          # checks from main still report. The ES container is gone.
          name: "checkout code: Ruby << matrix.ruby_version >>, ES 7.17.7, MySQL << matrix.mysql_version >>"
          matrix:
            parameters:
              ruby_version:
                - 3.3.7
              mysql_version:
                - "8.0.40"

      - rspec:
          requires:
            - checkout_code
          name: "rspec: Ruby << matrix.ruby_version >>, ES 7.17.7, MySQL << matrix.mysql_version >>"
          matrix:
            parameters:
              ruby_version:
                - 3.3.7
              mysql_version:
                - "8.0.40"

      - cucumber:
          requires:
            - checkout_code
          name: "cucumber: Ruby << matrix.ruby_version >>, ES 7.17.7, MySQL << matrix.mysql_version >>"
          matrix:
            parameters:
              ruby_version:
                - 3.3.7
              mysql_version:
                - "8.0.40"

      - jest:
          requires:
            - checkout_code
          name: "jest: NodeJS << matrix.node_version >>, Ruby << matrix.ruby_version >>, MySQL << matrix.mysql_version >>"
          matrix:
            parameters:
              ruby_version:
                - 3.3.7
              mysql_version:
                - "8.0.40"
              node_version:
                - 20.20.0
                - 22.22.2
